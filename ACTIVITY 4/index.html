<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Eunice Alce</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #e98eae;
            color: #49343d;
            font-family: Arial, Helvetica, sans-serif;
        }

        .brand {
            margin: 0 0 24px;
            color: #fff4e4;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .login-card {
            width: min(100%, 420px);
            padding: 40px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 16px 40px rgb(105 42 67 / 18%);
        }

        h1 {
            margin: 0 0 8px;
            color: #49343d;
            font-size: 1.8rem;
        }

        .intro {
            margin: 0 0 28px;
            color: #806c74;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #e4d8dd;
            border-radius: 9px;
            background: #fff;
            color: inherit;
            font: inherit;
        }

        input:focus {
            border-color: #d65f8b;
            outline: 3px solid rgb(214 95 139 / 18%);
        }

        button {
            width: 100%;
            min-height: 50px;
            margin-top: 4px;
            border: 0;
            border-radius: 9px;
            background: #d65f8b;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover {
            background: #c84e7b;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>
<body>
    <p class="brand">eunice alce</p>

    <main class="login-card">
        <h1>Welcome back</h1>
        <p class="intro">Log in with your email and country to continue.</p>

        <form>
            <div class="field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="field">
                <label for="country">Country</label>
                <input
                    type="text"
                    id="country"
                    name="country"
                    placeholder="Enter your country"
                    autocomplete="country-name"
                    required
                >
            </div>

            <button type="submit">Log in</button>
        </form>
    </main>
</body>
</html>
